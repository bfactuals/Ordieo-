name: Build Ordieo APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install dependencies & Build Web App
        run: |
          npm install
          npm run build

      - name: Setup Capacitor for Android
        run: |
          npm install @capacitor/core @capacitor/cli @capacitor/android
          if [ ! -f capacitor.config.json ] && [ ! -f capacitor.config.ts ]; then
            npx cap init "Ordieo" "com.ordieo.app" --web-dir dist
          fi
          if [ ! -d android ]; then
            npx cap add android
          fi

      - name: Add Microphone & Internet Permissions
        run: |
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          grep -q "RECORD_AUDIO" "$MANIFEST" || sed -i 's/<uses-permission android:name="android.permission.INTERNET" \/>/<uses-permission android:name="android.permission.INTERNET" \/>\n    <uses-permission android:name="android.permission.RECORD_AUDIO" \/>\n    <uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS" \/>/' "$MANIFEST"

      - name: Sync & Build APK
        run: |
          npx cap sync android
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload Ordieo APK
        uses: actions/upload-artifact@v4
        with:
          name: Ordieo-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          
